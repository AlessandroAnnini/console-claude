<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Console Claude</title>
    <style>
      html {
        color: CanvasText;
        background: Canvas;
        font: 14px system-ui, sans-serif;
      }
      body {
        max-width: 36rem;
        margin: 1.5rem;
      }
      form {
        display: flex;
        flex-direction: column;
        gap: 0.85rem;
      }
      label {
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
      }
      label:has(#confirm) {
        flex-direction: row;
        align-items: center;
      }
      input[type="text"],
      input[type="password"],
      input[type="number"] {
        font: inherit;
        padding: 0.35rem 0.5rem;
      }
      button {
        width: max-content;
        font: inherit;
        padding: 0.4rem 0.9rem;
        background: ButtonFace;
        color: ButtonText;
      }
      #status {
        min-height: 1.3em;
      }
    </style>
  </head>
  <body>
    <h1>Console Claude</h1>
    <p>Save your Anthropic API key. It stays in this browser, not on the page.</p>
    <form id="form">
      <label>
        API key
        <input id="apiKey" name="apiKey" type="password" autocomplete="off" />
      </label>
      <label>
        Model
        <input id="model" name="model" type="text" />
      </label>
      <label>
        Max steps
        <input id="maxSteps" name="maxSteps" type="number" min="1" max="100" />
      </label>
      <label>
        <input id="confirm" name="confirm" type="checkbox" />
        Ask before each JavaScript run
      </label>
      <p>Uncheck to let Claude run evals without prompting.</p>
      <button type="submit">Save</button>
    </form>
    <p id="status"></p>
    <script type="module" src="/src/options.ts"></script>
  </body>
</html>
