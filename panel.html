<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Console Claude</title>
    <style>
      :root {
        --bg: #f7f5ee;
        --ink: #171717;
        --muted: #55534d;
        --hair: #aaa69d;
        --paper: #faf9f5;
        --surface: #ece9e0;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        color: var(--ink);
        background: var(--bg);
        font: 14px/1.5 "IBM Plex Sans", Geist, Inter, "Segoe UI", sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        align-items: baseline;
        gap: 1rem;
        padding: 0.7rem 1rem;
        border-bottom: 1px solid var(--hair);
      }
      .mark {
        color: var(--muted);
        letter-spacing: 0.35em;
        font-size: 0.65rem;
        margin: 0;
      }
      h1 {
        font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
        font-weight: 500;
        font-size: 1.35rem;
        letter-spacing: -0.02em;
        margin: 0;
      }
      #origin {
        color: var(--muted);
        margin: 0;
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      a {
        color: var(--ink);
        text-decoration: none;
        border-bottom: 1px solid var(--hair);
      }
      a:hover {
        border-bottom-color: var(--ink);
      }
      .layout {
        --drawer-width: 216px;
        display: flex;
        flex: 1;
        min-height: 0;
      }
      aside {
        position: relative;
        width: var(--drawer-width);
        flex: 0 0 var(--drawer-width);
        border-right: 1px solid var(--hair);
        padding: 0.65rem 0.6rem;
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
        min-width: 0;
        overflow: hidden;
      }
      .layout:not(.drawer-dragging) aside {
        transition:
          width 0.2s ease,
          flex-basis 0.2s ease,
          padding 0.2s ease,
          border-color 0.2s ease;
      }
      .layout.drawer-closed aside {
        width: 0;
        flex-basis: 0;
        padding-left: 0;
        padding-right: 0;
        border-right-color: transparent;
      }
      #drawerResize {
        position: absolute;
        top: 0;
        right: -3px;
        z-index: 2;
        width: 7px;
        height: 100%;
        padding: 0;
        border: 0;
        background: transparent;
        color: inherit;
        cursor: col-resize;
      }
      .layout.drawer-closed #drawerResize {
        display: none;
      }
      #drawerToggle {
        padding: 0.12rem 0.4rem;
        font-size: 0.62rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      #sessions {
        list-style: none;
        margin: 0;
        padding: 0;
        overflow: auto;
      }
      #sessions li {
        display: flex;
        align-items: center;
        gap: 0.25rem;
        padding: 0.35rem 0.4rem;
        border: 1px solid transparent;
        cursor: pointer;
      }
      #sessions li.active {
        border-color: var(--hair);
        background: var(--surface);
      }
      #sessions li input {
        flex: 1;
        min-width: 0;
        font: inherit;
        color: var(--ink);
        background: var(--paper);
        border: 1px solid var(--hair);
        padding: 0.1rem 0.3rem;
      }
      #sessions .title {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #sessions .del {
        flex-shrink: 0;
        opacity: 0;
        border: 0;
        background: none;
        color: var(--muted);
        cursor: pointer;
        font: inherit;
        line-height: 1;
        padding: 0 0.15rem;
      }
      #sessions li:hover .del,
      #sessions li:focus-within .del,
      #sessions li.active .del {
        opacity: 1;
      }
      main {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      #banner {
        margin: 0;
        padding: 0.45rem 1rem;
        border-bottom: 1px solid var(--hair);
        color: var(--muted);
        font-size: 0.85rem;
      }
      #banner[hidden],
      #new[hidden],
      #sessionSearchWrap[hidden] {
        display: none;
      }
      #sessionSearch {
        width: 100%;
        min-width: 0;
        font: inherit;
        font-size: 0.78rem;
        color: var(--ink);
        background: var(--paper);
        border: 1px solid var(--hair);
        padding: 0.2rem 0.35rem;
      }
      #sessions li.none {
        cursor: default;
        color: var(--muted);
        border-color: transparent;
        background: none;
      }
      #turns {
        flex: 1;
        overflow: auto;
        padding: 0.85rem 1rem 1.2rem;
      }
      .empty {
        color: var(--muted);
        margin: 1.5rem 0 0;
      }
      .exchange + .exchange {
        margin-top: 1.5rem;
      }
      .exchange + .exchange::before {
        content: "○ ─ · ─ ✦";
        display: block;
        text-align: center;
        color: var(--muted);
        letter-spacing: 0.35em;
        font-size: 0.65rem;
        margin: 0 0 1.15rem;
        padding-top: 1.15rem;
        border-top: 1px solid var(--hair);
      }
      .exchange > :last-child {
        margin-bottom: 0;
      }
      .turn {
        margin: 0 0 0.9rem;
      }
      .thinking {
        display: flex;
        align-items: center;
        gap: 0.45rem;
        margin: 0.35rem 0 0;
        color: var(--muted);
        font-size: 0.65rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      .thinking .mark {
        animation: think 2.4s ease-in-out infinite;
      }
      @keyframes think {
        0%,
        100% {
          opacity: 0.22;
        }
        50% {
          opacity: 1;
        }
      }
      .turn .who {
        font-size: 0.65rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 0 0 0.2rem;
      }
      .turn.user p {
        margin: 0;
        white-space: pre-wrap;
      }
      .md {
        overflow-wrap: anywhere;
      }
      .md p,
      .md ul,
      .md ol {
        margin: 0 0 0.55rem;
      }
      .md pre {
        margin: 0 0 0.55rem;
        padding: 0.45rem 0.55rem;
        border: 1px solid var(--hair);
        background: var(--paper);
        overflow-x: auto;
        font: 0.78rem/1.4 ui-monospace, "IBM Plex Mono", monospace;
      }
      .md .code-block {
        position: relative;
        margin: 0 0 0.55rem;
        border: 1px solid var(--hair);
        background: var(--paper);
      }
      .md .code-block pre {
        margin: 0;
        border: 0;
        padding: 1.75rem 0.55rem 0.45rem 0;
      }
      .md .chip {
        padding: 0.12rem 0.4rem;
        font-size: 0.62rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        background: var(--paper);
        color: var(--ink);
        border: 1px solid var(--hair);
      }
      .md .code-block .copy {
        position: absolute;
        top: 0.3rem;
        right: 0.3rem;
        z-index: 1;
      }
      .md .copy-live {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
      }
      .md .code-block .line {
        display: block;
        padding-right: 0.55rem;
      }
      .md .code-block .line::before {
        content: counter(line);
        counter-increment: line;
        display: inline-block;
        width: 2.35rem;
        margin-right: 0.65rem;
        text-align: right;
        color: var(--hair);
        user-select: none;
      }
      .md .code-block code {
        counter-reset: line;
        color: var(--ink);
      }
      .md .hljs-comment,
      .md .hljs-quote {
        color: #8a857c;
      }
      .md .hljs-keyword,
      .md .hljs-selector-tag,
      .md .hljs-meta {
        color: #5c4033;
        font-weight: 500;
      }
      .md .hljs-title,
      .md .hljs-name,
      .md .hljs-section {
        color: #3a3f4a;
        font-weight: 500;
      }
      .md .hljs-string,
      .md .hljs-attr,
      .md .hljs-attribute,
      .md .hljs-symbol {
        color: #7a5340;
      }
      .md .hljs-built_in,
      .md .hljs-type,
      .md .hljs-class .hljs-title {
        color: #4a5340;
      }
      .md .hljs-number,
      .md .hljs-literal {
        color: #3d5348;
      }
      .md .hljs-params,
      .md .hljs-variable,
      .md .hljs-property,
      .md .hljs-template-variable {
        color: #4a463e;
      }
      .md table {
        border-collapse: collapse;
        margin: 0;
        width: max-content;
        max-width: 100%;
      }
      .md .table-wrap {
        overflow-x: auto;
        margin: 0 0 0.55rem;
      }
      .md th,
      .md td {
        border: 1px solid var(--hair);
        padding: 0.25rem 0.5rem;
        text-align: left;
      }
      .md th {
        background: var(--surface);
        font-weight: 500;
      }
      .md .diagram {
        position: relative;
        margin: 0 0 0.55rem;
        padding: 1.75rem 0.55rem 0.5rem;
        border: 1px solid var(--hair);
        background: var(--paper);
      }
      .md .diagram-tools {
        position: absolute;
        top: 0.3rem;
        right: 0.3rem;
        z-index: 1;
        display: flex;
        gap: 0.25rem;
      }
      .md .mermaid {
        margin: 0 0 0.55rem;
        overflow-x: auto;
      }
      .md .diagram .mermaid {
        margin: 0;
      }
      .md .mermaid svg {
        max-width: 100%;
        height: auto;
      }
      .turn .status {
        font-size: 0.65rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 0.25rem 0 0;
      }
      .tool {
        margin: 0.4rem 0 0;
        padding: 0.4rem 0.5rem;
        border: 1px solid var(--hair);
        background: var(--paper);
      }
      .tool .name {
        font-size: 0.65rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .tool pre {
        margin: 0.25rem 0 0;
        white-space: pre-wrap;
        font: 0.78rem/1.4 ui-monospace, "IBM Plex Mono", monospace;
      }
      #composer {
        display: flex;
        gap: 0.55rem;
        align-items: flex-end;
        padding: 0.65rem 1rem 0.85rem;
        border-top: 1px solid var(--hair);
      }
      textarea {
        flex: 1;
        min-height: 3.2rem;
        resize: vertical;
        font: inherit;
        color: var(--ink);
        background: var(--paper);
        border: 1px solid var(--hair);
        padding: 0.4rem 0.5rem;
      }
      textarea:focus,
      button:focus,
      input:focus {
        outline: 1px solid var(--ink);
        outline-offset: 1px;
      }
      button {
        font: inherit;
        padding: 0.4rem 0.95rem;
        background: var(--ink);
        color: var(--paper);
        border: 1px solid var(--ink);
        cursor: pointer;
      }
      button.secondary,
      #send.stop {
        background: transparent;
        color: var(--ink);
        border-color: var(--hair);
      }
      dialog {
        border: 1px solid var(--hair);
        background: var(--paper);
        color: var(--ink);
        padding: 1rem 1.1rem;
        max-width: 36rem;
      }
      dialog::backdrop {
        background: rgb(23 23 23 / 18%);
      }
      dialog p {
        margin: 0 0 0.5rem;
        font-size: 0.68rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
      }
      dialog pre {
        margin: 0 0 0.85rem;
        max-height: 12rem;
        overflow: auto;
        white-space: pre-wrap;
        font: 0.8rem/1.4 ui-monospace, "IBM Plex Mono", monospace;
      }
      dialog menu {
        display: flex;
        gap: 0.5rem;
        margin: 0;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <header>
      <p class="mark">○ ─ · ─ ✦</p>
      <button type="button" class="secondary" id="drawerToggle" aria-controls="drawer" aria-expanded="true">
        Sessions
      </button>
      <h1>Console Claude</h1>
      <p id="origin"></p>
      <a href="#" id="options">Options</a>
    </header>
    <div class="layout">
      <aside id="drawer">
        <button type="button" class="secondary" id="new" hidden>+ New</button>
        <div id="sessionSearchWrap" hidden>
          <input
            type="search"
            id="sessionSearch"
            placeholder="Search sessions"
            aria-label="Search sessions"
            autocomplete="off"
          />
        </div>
        <ul id="sessions"></ul>
        <button type="button" id="drawerResize" aria-label="Resize sessions" aria-orientation="vertical"></button>
      </aside>
      <main>
        <p id="banner" hidden></p>
        <div id="turns" role="log" aria-label="Transcript"></div>
        <form id="composer">
          <textarea id="goal" rows="3" placeholder="Ask about this page"></textarea>
          <button type="submit" id="send">Send</button>
        </form>
      </main>
    </div>
    <dialog id="confirmDlg">
      <p>Claude wants to execute</p>
      <pre id="confirmCode"></pre>
      <menu>
        <button type="button" id="allow">Allow</button>
        <button type="button" class="secondary" id="deny">Deny</button>
      </menu>
    </dialog>
    <script type="module" src="/src/panel.ts"></script>
  </body>
</html>
